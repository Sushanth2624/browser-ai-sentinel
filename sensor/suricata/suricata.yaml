%YAML 1.1
---
# Browser AI Sentinel — standalone Suricata sensor config.
#
# Deliberately NOT /etc/suricata/suricata.yaml (that's capstone-1's, its own systemd unit is
# already disabled/failed and untouched here). This is a minimal config focused on one job: TLS
# JA3/JA4 + SNI telemetry via eve.json, not intrusion alerting — no custom detection rules are
# loaded (rule-files is empty), which is why classification-file/reference-config-file below can
# safely point at the shared system copies (generic Suricata distribution files, not
# capstone-1-specific data) without depending on anything capstone-1 configured.

vars:
  address-groups:
    HOME_NET: "[172.16.242.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

default-log-dir: /home/analysis/browser-ai-sentinel/sensor/logs/suricata

af-packet:
  - interface: ens18
    cluster-id: 199
    cluster-type: cluster_flow
    defrag: yes
  # Also watch loopback: Phase 3's mock "unknown AI" endpoints (sensor/mock-ai) run on this same
  # host, and same-host traffic to a local address is handled internally by the kernel without
  # ever transiting the physical NIC — confirmed empirically (ens18-only capture saw nothing for
  # loopback TLS connections; -i lo does). A real deployment's actual AI-platform traffic goes out
  # ens18 same as before; lo only matters for this test harness.
  - interface: lo
    cluster-id: 198
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - tls:
            extended: yes
            ja3: yes
            ja4: yes

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        filename: suricata.log

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

default-rule-path: /var/lib/suricata/rules
rule-files: []

app-layer:
  protocols:
    tls:
      enabled: yes
      ja3-fingerprints: yes
